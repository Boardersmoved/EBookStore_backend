server:
  port: 8084

spring:
  application:
    name: price-calculator-service
  
  # Spring Cloud Function 配置
  cloud:
    function:
      definition: calculatePrice;calculatePriceReactive  # 定义可用的函数
      web:
        export:
          enabled: true  # 启用 Web 端点导出

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  level:
    com.example.pricecalculatorservice: INFO
    org.springframework.cloud.function: DEBUG  # 查看 Function 日志
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

