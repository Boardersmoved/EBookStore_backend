server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      # 开启从注册中心动态创建路由的功能
      discovery:
        locator:
          enabled: true
          # 服务名小写
          lower-case-service-id: true
      
      # 路由配置
      routes:
        # 路由1: 主应用 API
        - id: ebook-store-api
          uri: lb://EBOOK-STORE-BACKEND
          predicates:
            - Path=/api/**
        
        # 路由2: Author Service
        - id: author-service
          uri: lb://AUTHOR-SERVICE
          predicates:
            - Path=/author-service/**
          filters:
            - StripPrefix=1
      
      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
      
      # 超时配置
      httpclient:
        connect-timeout: 3000
        response-timeout: 5s

# Eureka客户端配置
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${server.port}
    prefer-ip-address: true

# 日志配置
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO
    com.example.apigateway: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

