[project]
name = "ebookstore-mcp"
version = "0.1.0"
description = "MCP server for E-BookStore system with MySQL database integration"
authors = [
    { name = "EBookStore Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.4.4",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookstore_mcp"]
